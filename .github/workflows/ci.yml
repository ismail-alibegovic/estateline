name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Check formatting and linting
        run: npm run lint

      - name: Check typescript types
        run: npm run type-check

      - name: Check i18n translation key parity
        run: npm run check:i18n

      - name: Check environment variables completeness
        run: npm run check:env

      - name: Run unit tests
        run: npm run test:unit

      - name: Run migration smoke tests
        run: npm run test:migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Run reporting RPC integration tests
        run: npm run test:rpcs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Run database RLS integration tests
        run: npm run test:rls
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-ci-anon-key

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
